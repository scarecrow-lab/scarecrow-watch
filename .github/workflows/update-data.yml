name: Update data

on:
  schedule:
    - cron: "15 23 * * *"   # every day 06:15 Bangkok time
  workflow_dispatch: {}     # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public data
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python scripts/fetch_data.py
      - name: Commit if anything changed
        run: |
          git config user.name "scarecrow-bot"
          git config user.email "scarecrow-bot@users.noreply.github.com"
          git add data/signals.json data/displacement.json data/meta.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
